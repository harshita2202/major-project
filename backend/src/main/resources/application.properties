spring.application.name=proctoring-backend
server.port=${SERVER_PORT:8080}

# Database Connection (loads from environment if provided, otherwise uses local defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/proctoring_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP resilience settings (handles laptop sleep/wake and connection recovery)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000